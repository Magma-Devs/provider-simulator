name: Lint and test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lint tools
        run: pip install 'black==26.5.1' 'ruff==0.15.20' 'mypy==2.2.0'
      - name: black --check
        run: black --check .
      - name: ruff check
        run: ruff check .
      - name: mypy
        run: mypy .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest
      # The suite boots real HTTP/gRPC listeners on isolated 28xxx/29xxx/48xxx+
      # test ports (see tests/test_simulator.py, tests/test_simulator_ws.py,
      # tests/test_simulator_grpc.py docstrings) — no mocking, so it needs an
      # actual runner, not just import checks.
      - name: pytest
        run: pytest tests/ -v
