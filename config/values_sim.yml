          - url: "https://g.w.lavanet.xyz:443/gateway/lava/rpc-http/YOUR_LAVA_GATEWAY_KEY"
            interface: "tendermintrpc"
            addons: []
  # lava-sim-tm — simulator router for the Tendermint-RPC chain (MAG-1842).
  # Three sim providers wired to the in-cluster provider-simulator's
  # Tendermint-RPC listeners on ports 18554–18556 (added by MAG-1841 /
  # provider-simulator PR #26). Required by MAG-1741's residual scope
  # (failure-mode + routing-behavior tests over TM RPC) which needs a
  # smart-router TM endpoint that fronts the simulator's TM handlers so
  # retry / failover / status-mapping behaviors can be exercised
  # deterministically.
  #
  # Distinct from:
  #   - ``lava-tm`` above — the real Lava gateway, used by PR #71's ~22
  #     happy-path tests under tests/tendermint/.
  #
  # Rendered ingress (chain-interface convention):
  # ``lava-sim-tm-tendermintrpc.<host>``.
  #
  # ``skip_verifications`` per sim node: the simulator returns
  # ``lava-sim-tm`` as its chain id (constants.TM_NETWORK_ID) rather
  # than ``lava-mainnet-1``, so the router's chain-id verification on
  # startup would otherwise reject the upstream. The ``pruning`` and
  # ``simulate`` skips mirror the lava-sim-rest precedent on MAG-1834.
  - id: "lava-sim-tm"
    network: "lava"
    nodes:
      - name: "LavaTmPrimaryProvider1"
        group_label: "voting-group-1"
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18554"
            interface: "tendermintrpc"
            addons: []
      - name: "LavaTmPrimaryProvider2"
        group_label: "voting-group-1"
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18555"
            interface: "tendermintrpc"
            addons: []
      - name: "LavaTmPrimaryProvider3"
        group_label: "voting-group-2"
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18556"
            interface: "tendermintrpc"
            addons: []
      # Backup tier (provider-simulator MAG-18xx surface-backup PR).
      # Distinct ProviderState pids 13-15 → 18569-18571. skip_verifications
      # repeats per-node because chain-id verification runs per-endpoint
      # during the router's BackupProviders validation pass.
      - name: "LavaTmBackupProvider4"
        is_backup: true
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18569"
            interface: "tendermintrpc"
            addons: []
      - name: "LavaTmBackupProvider5"
        is_backup: true
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18570"
            interface: "tendermintrpc"
            addons: []
      - name: "LavaTmBackupProvider6"
        is_backup: true
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18571"
            interface: "tendermintrpc"
            addons: []
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 1
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 75
  # lava-cv-tm-sim — the Tendermint-RPC cross-validation router (MAG-3046
  # follow-on). Six primary providers in three groups of two, no backup tier.
  # The Tendermint counterpart of eth-cv-sim and lava-cv-rest-sim, field for
  # field.
  #
  # Why a dedicated router rather than policies on lava-sim-tm: an operator
  # policy (enabled: true) makes cross-validation MANDATORY for that method for
  # every caller. A cross-validated reply carries the lava-cross-validation-*
  # headers INSTEAD of lava-provider-address, and the tests already on
  # lava-sim-tm assert lava-provider-address as proof the router is in the
  # request path. That is exactly what broke eight tests when a policy was put
  # on the shared REST router. Group diversity has no request header —
  # min_groups is operator-only — so the rules below cannot be reached
  # caller-side either.
  #
  # Why six providers in three groups: per-group quorum needs
  # max-participants >= min-groups * agreement-threshold, so three groups each
  # needing two matching answers needs six. Three providers in two groups covers
  # plain diversity and nothing else.
  #
  # No backup tier: cross-validation never reaches a backup, so a provider
  # labelled backup would claim a group the router can never count.
  #
  # EVERY POLICY NAMES api_interface. The production chart renders
  # `api-interface: {{ $policy.api_interface | default "jsonrpc" }}`
  # (charts/smart-router/templates/routers_configmap.yaml), so a policy that
  # omits it is filed under jsonrpc — an interface no request on this router ever
  # uses. It would match nothing, the router would start clean, and no test would
  # notice. The local k3d chart instead renders `api-interface: {{ $router.interface }}`,
  # so the same values would behave differently on the two clusters.
  #
  # `tendermintrpc` is the interface string the router itself uses: the chart
  # collects the listen endpoint's api-interface from the `interface` key on the
  # nodes below, and the router looks a policy up by (chain-id, api-interface,
  # method). It is the same spelling every lava-sim-tm endpoint already carries.
  #
  # Each method is a Tendermint-RPC method written exactly as the chain spec
  # names it. All five are marked `stateful: 0` in the spec, which matters: an
  # enabled policy on a stateful method is refused at startup
  # (ValidateNoStatefulPolicies), which crash-loops the pod. The four
  # transaction-submission methods (broadcast_tx_async / broadcast_tx_sync /
  # broadcast_tx_commit / broadcast_evidence) are the stateful ones and are
  # deliberately absent.
  #
  # All five are also methods the provider-simulator answers with a canned body
  # (stubs_tendermintrpc.TENDERMINT_METHOD_DEFAULTS), so every provider returns
  # the same answer and agreement is reachable without a scenario.
  - id: "lava-cv-tm-sim"
    network: "lava"
    cross_validation_policies:
      # Strict: ask 3, 2 must match, and those 2 must come from different
      # groups. A caller may tighten the quorum from 2 to 3; max_participants is
      # pinned because floor equals cap; min_groups has no cap.
      - method: "block"
        api_interface: "tendermintrpc"
        enabled: true
        max_participants:
          floor: 3
          cap: 3
        agreement_threshold:
          floor: 2
          cap: 3
        min_groups:
          floor: 2
      # Loose: one matching answer from one group is enough. Proves a relaxed
      # rule is honoured rather than quietly raised to a default.
      - method: "validators"
        api_interface: "tendermintrpc"
        enabled: true
        max_participants:
          floor: 1
          cap: 6
        agreement_threshold:
          floor: 1
          cap: 6
        min_groups:
          floor: 1
      # Per-group quorum across two groups: each of two groups must reach two
      # matching answers on its own, then the two group winners must match.
      # Needs 2 * 2 = 4 participants — impossible on a three-provider router.
      - method: "abci_query"
        api_interface: "tendermintrpc"
        enabled: true
        per_group_quorum: true
        max_participants:
          floor: 4
          cap: 6
        agreement_threshold:
          floor: 2
          cap: 3
        min_groups:
          floor: 2
      # Per-group quorum across all three groups: 3 * 2 = 6 participants, the
      # whole pool. The strictest shape this router can be asked for.
      - method: "net_info"
        api_interface: "tendermintrpc"
        enabled: true
        per_group_quorum: true
        max_participants:
          floor: 6
          cap: 6
        agreement_threshold:
          floor: 2
          cap: 2
        min_groups:
          floor: 3
      # Forbidden: a caller's cross-validation headers are ignored outright on
      # this method — the router does not even parse them. Not the same as
      # enabled: false, which only declines to require cross-validation and
      # still honours caller headers. `enabled` and `forbid_caller_cv` on one
      # policy is refused at startup, so this policy carries no other key.
      #
      # status is the right method to forbid on, and the Tendermint counterpart
      # of the REST router's node_info: the spec marks it non-deterministic, so
      # two honest providers may legitimately differ, and this is the one method
      # where the router never compares answers at all.
      - method: "status"
        api_interface: "tendermintrpc"
        forbid_caller_cv: true
    # skip_verifications mirrors lava-sim-tm, including tx-indexing: the
    # simulator returns its own chain id and its Tendermint stubs do not satisfy
    # the router's startup chain-fetcher checks.
    #
    # addons stay empty on every provider, as on lava-sim-tm. The archive
    # asymmetry on eth-cv-sim exists to make an addon-narrowed candidate set
    # reachable on JSON-RPC; nothing here asks for an extension, and an
    # asymmetry no test reads is an assumption waiting to be depended on.
    nodes:
      - name: "LavaCvTmPrimaryProvider1"
        group_label: "voting-group-1"
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18608"
            interface: "tendermintrpc"
            addons: []
      - name: "LavaCvTmPrimaryProvider2"
        group_label: "voting-group-1"
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18609"
            interface: "tendermintrpc"
            addons: []
      - name: "LavaCvTmPrimaryProvider3"
        group_label: "voting-group-2"
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18610"
            interface: "tendermintrpc"
            addons: []
      - name: "LavaCvTmPrimaryProvider4"
        group_label: "voting-group-2"
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18611"
            interface: "tendermintrpc"
            addons: []
      - name: "LavaCvTmPrimaryProvider5"
        group_label: "voting-group-3"
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18612"
            interface: "tendermintrpc"
            addons: []
      - name: "LavaCvTmPrimaryProvider6"
        group_label: "voting-group-3"
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18613"
            interface: "tendermintrpc"
            addons: []
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 1
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 75
  # Solana JSON-RPC (Phase 4 bonus — unblocks Solana classifier paths).
  # wss endpoint omitted; see BUGS/JIRA_DRAFT_WEBSOCKET_TRANSPORT.md.
  - id: "solana"
    network: "solana"
    nodes:
      # Pairs http + wss under one provider; interface stays "jsonrpc" — binary picks transport from URL scheme.
      - name: "LavaGateway"
        endpoints:
          - url: "https://g.w.lavanet.xyz:443/gateway/solana/rpc-http/YOUR_LAVA_GATEWAY_KEY"
            interface: "jsonrpc"
            addons: []
          - url: "wss://g.w.lavanet.xyz:443/gateway/solana/rpc/YOUR_LAVA_GATEWAY_KEY"
            interface: "jsonrpc"
      # Tatum mainnet JSON-RPC — second distinct upstream so cross-validation
      # can fire (validateCrossValidationCapacity needs >= 2 providers). API
      # key passed via x-api-key header (Tatum's auth model).
      - name: "Tatum1"
        endpoints:
          - url: "https://solana-mainnet.gateway.tatum.io"
            interface: "jsonrpc"
            addons: []
            auth_config:
              auth_headers:
                x-api-key: "YOUR_TATUM_API_KEY"
  # Solana testnet JSON-RPC. Three independent testnet upstreams: PublicNode
  # (keyless), Lava gateway solanat path, QuickNode (keyed).
  - id: "solana-testnet"
    network: "solana"
    # Solana runs version and tokens-owner-indexed verifications, both of which
    # pass on testnet providers — nothing needs skipping. skip_verifications
    # matches a verification name from the chain spec; "enabled" and "chain-id"
    # are names from other chains' specs, so they matched nothing here.
    # genesis-hash is only in the devnet spec index, not testnet.
    nodes:
      - name: "PublicNode"
        endpoints:
          - url: "https://solana-testnet-rpc.publicnode.com"
            interface: "jsonrpc"
            addons: []
      - name: "LavaGateway"
        endpoints:
          - url: "https://g.w.lavanet.xyz:443/gateway/solanat/rpc-http/YOUR_LAVA_GATEWAY_KEY"
            interface: "jsonrpc"
            addons: []
      - name: "QuickNode1"
        endpoints:
          - url: "YOUR_SOLANA_TESTNET_QUICKNODE_URL"
            interface: "jsonrpc"
            addons: []
