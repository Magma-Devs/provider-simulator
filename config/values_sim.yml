        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18583"
            interface: "jsonrpc"
            addons: []
      - name: "SimSolanaProvider3"
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18584"
            interface: "jsonrpc"
            addons: []
    autoscaling:
