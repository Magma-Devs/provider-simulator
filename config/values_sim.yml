routers:
  - id: "base"
    network: "base"
    nodes:
      - name: "Lava1"
        endpoints:
          - url: "https://base.lava.build:443/"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
      - name: "Lava2"
        endpoints:
          - url: "https://base.lava.build:443/"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
      - name: "Lava3"
        endpoints:
          - url: "https://base.lava.build:443/"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
  - id: "eth"
    network: "eth1"
    nodes:
      # Pairs http + wss under one provider; interface stays "jsonrpc" — binary picks WS transport from URL scheme.
      - name: "Google1"
        skip_verifications: "chain-id,pruning"
        endpoints:
          - url: "YOUR_ETH_RPC_PROVIDER_URL"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
          - url: "wss://g.w.lavanet.xyz:443/gateway/eth/rpc/YOUR_LAVA_GATEWAY_KEY"
            interface: "jsonrpc"
      - name: "QuickNode1"
        skip_verifications: "chain-id,pruning"
        endpoints:
          - url: "YOUR_ETH_QUICKNODE_URL"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
  # eth-sim — simulator router (only in values_sim.yml, not in core values.yml)
  # Three sim providers wired to the in-cluster provider-simulator service.
  - id: "eth-sim"
    network: "eth1"
    cross_validation_policies:
      # Mandates CV with operator floors. Absent caller headers, the floor
      # is the effective value. A caller may raise a field within its
      # [floor, cap] range (e.g. agreement_threshold 2 -> 3); a field with
      # floor == cap (max_participants) is pinned, and min_groups has no cap.
      - method: "eth_getBlockByNumber"
        enabled: true
        agreement_threshold:
          floor: 2
          cap: 3
        max_participants:
          floor: 3
          cap: 3
        min_groups:
          floor: 2
      # Operator forbids CV outright for eth_chainId — caller
      # lava-cross-validation-* headers are ignored for this method.
      - method: "eth_chainId"
        forbid_caller_cv: true
    nodes:
      - name: "SimProvider1"
        group_label: "tier-1"
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18545"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
          - url: "ws://provider-simulator.lava-infra.svc.cluster.local:18557/ws"
            interface: "jsonrpc"
      - name: "SimProvider2"
        group_label: "tier-1"
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18546"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
          - url: "ws://provider-simulator.lava-infra.svc.cluster.local:18558/ws"
            interface: "jsonrpc"
      - name: "SimProvider3"
        group_label: "external"
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18547"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
          - url: "ws://provider-simulator.lava-infra.svc.cluster.local:18559/ws"
            interface: "jsonrpc"
      # Backup tier — consulted only when the primary pool (SimProvider1-3)
      # is exhausted on a request (PairingListEmptyError → backup fallback
      # in smart-router consumer_session_manager.go:826). Listeners on
      # 18560-18562 are added by provider-simulator's PR #20; the WS-backup
      # endpoints on 18572-18574 are added by the MAG-18xx surface-backup
      # PR (mirrors the primary tier's http+ws pairing on SimProvider1-3).
      # This entry wires both into the chart's `backup-direct-rpc:` section
      # via is_backup: true.
      #
      # Port history: SimBackup1-3 originally targeted 18554-18556 but those
      # ports got reused by the Tendermint-RPC primary listeners (MAG-1841);
      # the JSON-RPC backup pool moved to 18560-18562 in provider-simulator
      # commit dc65672. Updating these URLs here is required — without the
      # change, every backup request lands on the TM handler.
      #
      # Addons must match the primary tier or `lava-extension: archive`
      # requests skip the backup pool silently via IsSupportingAddon
      # (consumer_session_manager.go:1361).
      - name: "SimBackup1"
        is_backup: true
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18560"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
          - url: "ws://provider-simulator.lava-infra.svc.cluster.local:18572/ws"
            interface: "jsonrpc"
      - name: "SimBackup2"
        is_backup: true
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18561"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
          - url: "ws://provider-simulator.lava-infra.svc.cluster.local:18573/ws"
            interface: "jsonrpc"
      - name: "SimBackup3"
        is_backup: true
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18562"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
          - url: "ws://provider-simulator.lava-infra.svc.cluster.local:18574/ws"
            interface: "jsonrpc"
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 1
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 75
  # eth-solo-sim — single-provider simulator router (MAG-2061). One
  # primary node, zero backups — the customer-outage deployment shape
  # used by the single-provider-no-auto-recover + single-provider-under-
  # threshold-recovery test groups. Wired to a dedicated provider-simulator
  # listener (pid 19 / port 18581) so a /scenario flip on pid 19 cannot
  # collide with eth-sim primary/backup state. Mirrors eth-sim shape:
  # addons archive/trace/debug, network eth1. WebSocket endpoint omitted
  # because the tests only exercise the HTTP JSON-RPC path; if WS becomes
  # needed later, allocate a dedicated WS port + listener rather than
  # sharing the eth-sim WS pool.
  - id: "eth-solo-sim"
    network: "eth1"
    nodes:
      - name: "SimProvider19"
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18581"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 1
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 75
  # LAVA over REST
  - id: "lava-rest"
    network: "lava"
    nodes:
      - name: "LavaGateway"
        endpoints:
          - url: "https://g.w.lavanet.xyz:443/gateway/lava/rest/YOUR_LAVA_GATEWAY_KEY"
            interface: "rest"
            addons: []
  # lava-sim-rest — simulator router for the Cosmos REST chain (MAG-1834).
  # Three sim providers wired to the in-cluster provider-simulator's REST
  # listeners on ports 18551–18553 (added by MAG-1777 / provider-simulator
  # PR #18). Required by MAG-1740's REST-routing tests, which need a
  # smart-router REST endpoint that fronts the simulator's REST handlers
  # so retry / failover / status-mapping behaviors can be exercised
  # deterministically.
  #
  # Distinct from:
  #   - ``lava-rest`` above — the real Lava gateway, used by MAG-1772.
  #   - ``lava-sim-rest.<host>`` — the simulator-direct ingress (no
  #     smart-router in the path), useful for debugging the simulator's
  #     own response shapes but not for testing router behavior.
  #
  # Rendered ingress (chain-interface convention):
  # ``lava-sim-rest-rest.<host>``.
  - id: "lava-sim-rest"
    network: "lava"
    nodes:
      - name: "SimProvider1"
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18551"
            interface: "rest"
            addons: []
      - name: "SimProvider2"
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18552"
            interface: "rest"
            addons: []
      - name: "SimProvider3"
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18553"
            interface: "rest"
            addons: []
      # Backup tier (provider-simulator MAG-18xx surface-backup PR).
      # Distinct ProviderState pids 10-12 → 18566-18568 in the simulator;
      # the smart-router consults this pool only after the primary
      # SimProvider1-3 pool is exhausted on a request. Addons must match
      # the primary tier (empty here) — see IsSupportingAddon note above.
      - name: "SimRestBackup1"
        is_backup: true
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18566"
            interface: "rest"
            addons: []
      - name: "SimRestBackup2"
        is_backup: true
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18567"
            interface: "rest"
            addons: []
      - name: "SimRestBackup3"
        is_backup: true
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18568"
            interface: "rest"
            addons: []
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 1
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 75
  # lava-sim-grpc — simulator router for the Cosmos gRPC chain (MAG-1780
  # primary + MAG-18xx surface-backup PR). Wires the simulator's gRPC
  # listeners (handlers_grpc.CosmosBaseTendermintServicer) into the
  # smart-router so retry / failover / status-mapping over gRPC can be
  # exercised end-to-end the same way lava-sim-rest covers REST.
  #
  # Distinct from:
  #   - ``lava-grpc`` below — the real Lava gateway over gRPC.
  #   - The bare gRPCRoute (k8s/grpcroute-lava-sim-grpc.yml) which exposes
  #     the primary listeners directly without a smart-router in front.
  #
  # Primaries on 18548-18550 (pids 1-3, shared ProviderState with the
  # matching JSON-RPC primary). Backups on 18563-18565 (pids 7-9, distinct
  # ProviderState per pid).
  - id: "lava-sim-grpc"
    network: "lava"
    nodes:
      - name: "SimGrpcProvider1"
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "grpc://provider-simulator.lava-infra.svc.cluster.local:18548"
            interface: "grpc"
            addons: []
      - name: "SimGrpcProvider2"
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "grpc://provider-simulator.lava-infra.svc.cluster.local:18549"
            interface: "grpc"
            addons: []
      - name: "SimGrpcProvider3"
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "grpc://provider-simulator.lava-infra.svc.cluster.local:18550"
            interface: "grpc"
            addons: []
      - name: "SimGrpcBackup1"
        is_backup: true
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "grpc://provider-simulator.lava-infra.svc.cluster.local:18563"
            interface: "grpc"
            addons: []
      - name: "SimGrpcBackup2"
        is_backup: true
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "grpc://provider-simulator.lava-infra.svc.cluster.local:18564"
            interface: "grpc"
            addons: []
      - name: "SimGrpcBackup3"
        is_backup: true
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "grpc://provider-simulator.lava-infra.svc.cluster.local:18565"
            interface: "grpc"
            addons: []
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 1
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 75
  # LAVA over gRPC (token-prefix subdomain format). Chart 5.0.1 (MAG-1684)
  # accepts grpcs:// directly — no manual ConfigMap edit needed.
  - id: "lava-grpc"
    network: "lava"
    nodes:
      - name: "LavaGateway"
        endpoints:
          - url: "grpcs://YOUR_LAVA_GATEWAY_KEY-lava.g.w.lavanet.xyz:443"
            interface: "grpc"
            auth-config:
              use-tls: true
  # LAVA Tendermint RPC — wss endpoint omitted (test framework can't COMPARE
  # against wss URLs; see BUGS/JIRA_DRAFT_WEBSOCKET_TRANSPORT.md).
  - id: "lava-tm"
    network: "lava"
    nodes:
      - name: "LavaGateway"
        endpoints:
          - url: "https://g.w.lavanet.xyz:443/gateway/lava/rpc-http/YOUR_LAVA_GATEWAY_KEY"
            interface: "tendermintrpc"
            addons: []
  # lava-sim-tm — simulator router for the Tendermint-RPC chain (MAG-1842).
  # Three sim providers wired to the in-cluster provider-simulator's
  # Tendermint-RPC listeners on ports 18554–18556 (added by MAG-1841 /
  # provider-simulator PR #26). Required by MAG-1741's residual scope
  # (failure-mode + routing-behavior tests over TM RPC) which needs a
  # smart-router TM endpoint that fronts the simulator's TM handlers so
  # retry / failover / status-mapping behaviors can be exercised
  # deterministically.
  #
  # Distinct from:
  #   - ``lava-tm`` above — the real Lava gateway, used by PR #71's ~22
  #     happy-path tests under tests/tendermint/.
  #
  # Rendered ingress (chain-interface convention):
  # ``lava-sim-tm-tendermintrpc.<host>``.
  #
  # ``skip_verifications`` per sim node: the simulator returns
  # ``lava-sim-tm`` as its chain id (constants.TM_NETWORK_ID) rather
  # than ``lava-mainnet-1``, so the router's chain-id verification on
  # startup would otherwise reject the upstream. The ``pruning`` and
  # ``simulate`` skips mirror the lava-sim-rest precedent on MAG-1834.
  - id: "lava-sim-tm"
    network: "lava"
    nodes:
      - name: "SimProvider1"
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18554"
            interface: "tendermintrpc"
            addons: []
      - name: "SimProvider2"
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18555"
            interface: "tendermintrpc"
            addons: []
      - name: "SimProvider3"
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18556"
            interface: "tendermintrpc"
            addons: []
      # Backup tier (provider-simulator MAG-18xx surface-backup PR).
      # Distinct ProviderState pids 13-15 → 18569-18571. skip_verifications
      # repeats per-node because chain-id verification runs per-endpoint
      # during the router's BackupProviders validation pass.
      - name: "SimTmBackup1"
        is_backup: true
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18569"
            interface: "tendermintrpc"
            addons: []
      - name: "SimTmBackup2"
        is_backup: true
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18570"
            interface: "tendermintrpc"
            addons: []
      - name: "SimTmBackup3"
        is_backup: true
        skip_verifications: "chain-id,pruning,simulate,tx-indexing"
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18571"
            interface: "tendermintrpc"
            addons: []
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 1
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 75
  # Solana JSON-RPC (Phase 4 bonus — unblocks Solana classifier paths).
  # wss endpoint omitted; see BUGS/JIRA_DRAFT_WEBSOCKET_TRANSPORT.md.
  - id: "solana"
    network: "solana"
    nodes:
      # Pairs http + wss under one provider; interface stays "jsonrpc" — binary picks transport from URL scheme.
      - name: "LavaGateway"
        endpoints:
          - url: "https://g.w.lavanet.xyz:443/gateway/solana/rpc-http/YOUR_LAVA_GATEWAY_KEY"
            interface: "jsonrpc"
            addons: []
          - url: "wss://g.w.lavanet.xyz:443/gateway/solana/rpc/YOUR_LAVA_GATEWAY_KEY"
            interface: "jsonrpc"
      # Tatum mainnet JSON-RPC — second distinct upstream so cross-validation
      # can fire (validateCrossValidationCapacity needs >= 2 providers). API
      # key passed via x-api-key header (Tatum's auth model).
      - name: "Tatum1"
        endpoints:
          - url: "https://solana-mainnet.gateway.tatum.io"
            interface: "jsonrpc"
            addons: []
            auth_config:
              auth_headers:
                x-api-key: "YOUR_TATUM_API_KEY"
  # Solana testnet JSON-RPC. Three independent testnet upstreams: PublicNode
  # (keyless), Lava gateway solanat path, QuickNode (keyed).
  - id: "solana-testnet"
    network: "solana"
    # Solana runs version and tokens-owner-indexed verifications, both of which
    # pass on testnet providers — nothing needs skipping. skip_verifications
    # matches a verification name from the chain spec; "enabled" and "chain-id"
    # are names from other chains' specs, so they matched nothing here.
    # genesis-hash is only in the devnet spec index, not testnet.
    nodes:
      - name: "PublicNode"
        endpoints:
          - url: "https://solana-testnet-rpc.publicnode.com"
            interface: "jsonrpc"
            addons: []
      - name: "LavaGateway"
        endpoints:
          - url: "https://g.w.lavanet.xyz:443/gateway/solanat/rpc-http/YOUR_LAVA_GATEWAY_KEY"
            interface: "jsonrpc"
            addons: []
      - name: "QuickNode1"
        endpoints:
          - url: "YOUR_SOLANA_TESTNET_QUICKNODE_URL"
            interface: "jsonrpc"
            addons: []
  # Bitcoin JSON-RPC (Phase 4 bonus — unblocks Group 13 tier-2 classifier tests)
  - id: "btc"
    network: "btc"
    nodes:
      - name: "LavaGateway"
        endpoints:
          - url: "https://g.w.lavanet.xyz:443/gateway/btc/rpc-http/YOUR_LAVA_GATEWAY_KEY"
            interface: "jsonrpc"
            addons: []
  # Bitcoin JSON-RPC simulator-backed — unblocks MAG-1744 (the BTC suite
  # at smart_router_automation/tests/simulator/btc/). Mirrors eth-sim's
  # shape, but on its own listeners: btc-sim binds 18575-18577 (MAG-2089),
  # NOT eth-sim's 18545-18547. The topology table in
  # provider_simulator/topology.py declares those same three ports; if the
  # urls below and that table ever disagree, the table is correct.
  #
  # Handler dispatch is port-derived: the listener a request arrives on
  # decides whether handlers_btc.py or handlers_eth.py serves it. There is
  # no per-provider chain_family check on the success path. chain_family
  # still gates the content fault primitives (error / rate_limit / hang /
  # drop_connection / corruption), and mode="down" ignores it and fires on
  # every listener (MAG-2092).
  #
  # Rendered ingress (chain-interface convention):
  # ``btc-sim-jsonrpc.<host>``.
  #
  # ``skip_verifications`` per sim node: the simulator returns its
  # static BTC stubs (height 850000, deterministic block hashes from
  # btc_block_hash(N)) rather than the production Bitcoin chain values
  # the router's startup chain-id / pruning verifications expect.
  # Mirrors the lava-sim-rest precedent on MAG-1834. The eth-sim
  # variant escapes verification entirely because handlers_eth.py
  # returns chain-id consistent with the deployed spec; the BTC sim
  # stubs are intentionally short for test determinism and would
  # otherwise fail pre-request validation.
  - id: "btc-sim"
    network: "btc"
    nodes:
      - name: "SimBtcProvider1"
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18575"
            interface: "jsonrpc"
            addons: []
      - name: "SimBtcProvider2"
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18576"
            interface: "jsonrpc"
            addons: []
      - name: "SimBtcProvider3"
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.lava-infra.svc.cluster.local:18577"
            interface: "jsonrpc"
            addons: []
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 1
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 75
  # Solana JSON-RPC simulator-backed (MAG-2231) — fronts the provider-simulator's
