routers:
  - id: "base"
    network: "base"
    nodes:
      - name: "Lava1"
        endpoints:
          - url: "https://base.lava.build:443/"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
      - name: "Lava2"
        endpoints:
          - url: "https://base.lava.build:443/"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
      - name: "Lava3"
        endpoints:
          - url: "https://base.lava.build:443/"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
  - id: "eth"
    network: "eth1"
    nodes:
      # Pairs http + wss under one provider; interface stays "jsonrpc" — binary picks WS transport from URL scheme.
      - name: "Google1"
        skip_verifications: "chain-id,pruning"
        endpoints:
          - url: "YOUR_ETH_RPC_PROVIDER_URL"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
          - url: "wss://g.w.lavanet.xyz:443/gateway/eth/rpc/YOUR_LAVA_GATEWAY_KEY"
            interface: "jsonrpc"
      - name: "QuickNode1"
        skip_verifications: "chain-id,pruning"
        endpoints:
          - url: "YOUR_ETH_QUICKNODE_URL"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
  # eth-sim — simulator router (only in values_sim.yml, not in core values.yml)
  # Three sim providers wired to the in-cluster provider-simulator service.
  - id: "eth-sim"
    network: "eth1"
    cross_validation_policies:
      # Mandates CV with operator floors. Absent caller headers, the floor
      # is the effective value. A caller may raise a field within its
      # [floor, cap] range (e.g. agreement_threshold 2 -> 3); a field with
      # floor == cap (max_participants) is pinned, and min_groups has no cap.
      - method: "eth_getBlockByNumber"
        enabled: true
        agreement_threshold:
          floor: 2
          cap: 3
        max_participants:
          floor: 3
          cap: 3
        min_groups:
          floor: 2
      # Operator forbids CV outright for eth_chainId — caller
      # lava-cross-validation-* headers are ignored for this method.
      - method: "eth_chainId"
        forbid_caller_cv: true
    nodes:
      - name: "EthPrimaryProvider1"
        group_label: "voting-group-1"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18545"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
          - url: "ws://provider-simulator.smart-router.svc.cluster.local:18557/ws"
            interface: "jsonrpc"
      - name: "EthPrimaryProvider2"
        group_label: "voting-group-1"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18546"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
          - url: "ws://provider-simulator.smart-router.svc.cluster.local:18558/ws"
            interface: "jsonrpc"
      - name: "EthPrimaryProvider3"
        group_label: "voting-group-2"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18547"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
          - url: "ws://provider-simulator.smart-router.svc.cluster.local:18559/ws"
            interface: "jsonrpc"
      # Backup tier — consulted only when the primary pool
      # is exhausted on a request (PairingListEmptyError → backup fallback
      # in smart-router consumer_session_manager.go:826). Listeners on
      # 18560-18562 are added by provider-simulator's PR #20; the WS-backup
      # endpoints on 18572-18574 are added by the MAG-18xx surface-backup
      # PR (mirrors the primary tier's http+ws pairing).
      # This entry wires both into the chart's `backup-direct-rpc:` section
      # via is_backup: true.
      #
      # Port history: the backup slots originally targeted 18554-18556 but those
      # ports got reused by the Tendermint-RPC primary listeners (MAG-1841);
      # the JSON-RPC backup pool moved to 18560-18562 in provider-simulator
      # commit dc65672. Updating these URLs here is required — without the
      # change, every backup request lands on the TM handler.
      #
      # Addons must match the primary tier or `lava-extension: archive`
      # requests skip the backup pool silently via IsSupportingAddon
      # (consumer_session_manager.go:1361).
      - name: "EthBackupProvider4"
        is_backup: true
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18560"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
          - url: "ws://provider-simulator.smart-router.svc.cluster.local:18572/ws"
            interface: "jsonrpc"
      - name: "EthBackupProvider5"
        is_backup: true
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18561"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
          - url: "ws://provider-simulator.smart-router.svc.cluster.local:18573/ws"
            interface: "jsonrpc"
      - name: "EthBackupProvider6"
        is_backup: true
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18562"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
          - url: "ws://provider-simulator.smart-router.svc.cluster.local:18574/ws"
            interface: "jsonrpc"
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 1
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 75
  # eth-solo-sim — single-provider simulator router (MAG-2061). One
  # primary node, zero backups — the customer-outage deployment shape
  # used by the single-provider-no-auto-recover + single-provider-under-
  # threshold-recovery test groups. Wired to a dedicated provider-simulator
  # listener (pid 19 / port 18581) so a /scenario flip on pid 19 cannot
  # collide with eth-sim primary/backup state. Mirrors eth-sim shape:
  # addons archive/trace/debug, network eth1. WebSocket endpoint omitted
  # because the tests only exercise the HTTP JSON-RPC path; if WS becomes
  # needed later, allocate a dedicated WS port + listener rather than
  # sharing the eth-sim WS pool.
  - id: "eth-solo-sim"
    network: "eth1"
    nodes:
      - name: "EthSoloProvider1"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18581"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 1
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 75
  - id: "eth-cv-sim"
    network: "eth1"
    cross_validation_policies:
      # Strict: the same shape eth-sim runs, so a test written against one
      # means the same thing on the other. A caller may tighten the quorum
      # from 2 to 3; max_participants is pinned; min_groups has no cap.
      - method: "eth_getBlockByNumber"
        enabled: true
        max_participants:
          floor: 3
          cap: 3
        agreement_threshold:
          floor: 2
          cap: 3
        min_groups:
          floor: 2
      # Loose: one matching answer from one group is enough. Proves a relaxed
      # rule is honoured rather than quietly raised to a default.
      - method: "eth_getCode"
        enabled: true
        max_participants:
          floor: 1
          cap: 6
        agreement_threshold:
          floor: 1
          cap: 6
        min_groups:
          floor: 1
      # Per-group quorum across two groups: each of two groups must reach two
      # matching answers on its own, then the two group winners must match.
      # Needs 2 * 2 = 4 participants — impossible on a three-provider router.
      - method: "eth_getStorageAt"
        enabled: true
        per_group_quorum: true
        max_participants:
          floor: 4
          cap: 6
        agreement_threshold:
          floor: 2
          cap: 3
        min_groups:
          floor: 2
      # Per-group quorum across all three groups: 3 * 2 = 6 participants, the
      # whole pool. The strictest shape this router can be asked for.
      - method: "eth_getTransactionCount"
        enabled: true
        per_group_quorum: true
        max_participants:
          floor: 6
          cap: 6
        agreement_threshold:
          floor: 2
          cap: 2
        min_groups:
          floor: 3
      # Forbidden: a caller's cross-validation headers are ignored outright on
      # this method. Not the same as enabled: false, which only declines to
      # require cross-validation and still honours caller headers.
      - method: "eth_chainId"
        forbid_caller_cv: true
    nodes:
      - name: "EthCvPrimaryProvider1"
        group_label: "voting-group-1"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18596"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
      - name: "EthCvPrimaryProvider2"
        group_label: "voting-group-1"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18597"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
      - name: "EthCvPrimaryProvider3"
        group_label: "voting-group-2"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18598"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
      - name: "EthCvPrimaryProvider4"
        group_label: "voting-group-2"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18599"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
      - name: "EthCvPrimaryProvider5"
        group_label: "voting-group-3"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18600"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
      - name: "EthCvPrimaryProvider6"
        group_label: "voting-group-3"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18601"
            interface: "jsonrpc"
            addons: ["archive", "trace", "debug"]
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 1
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 75
  # LAVA over REST
  - id: "lava-rest"
    network: "lava"
    nodes:
      - name: "LavaGateway"
        endpoints:
          - url: "https://g.w.lavanet.xyz:443/gateway/lava/rest/YOUR_LAVA_GATEWAY_KEY"
            interface: "rest"
            addons: []
  # lava-sim-rest — simulator router for the Cosmos REST chain (MAG-1834).
  # Three sim providers wired to the in-cluster provider-simulator's REST
  # listeners on ports 18551–18553 (added by MAG-1777 / provider-simulator
  # PR #18). Required by MAG-1740's REST-routing tests, which need a
  # smart-router REST endpoint that fronts the simulator's REST handlers
  # so retry / failover / status-mapping behaviors can be exercised
  # deterministically.
  #
  # Distinct from:
  #   - ``lava-rest`` above — the real Lava gateway, used by MAG-1772.
  #   - ``lava-sim-rest.<host>`` — the simulator-direct ingress (no
  #     smart-router in the path), useful for debugging the simulator's
  #     own response shapes but not for testing router behavior.
  #
  # Rendered ingress (chain-interface convention):
  # ``lava-sim-rest-rest.<host>``.
  - id: "lava-sim-rest"
    network: "lava"
    nodes:
      - name: "LavaRestPrimaryProvider1"
        group_label: "voting-group-1"
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18551"
            interface: "rest"
            addons: []
      - name: "LavaRestPrimaryProvider2"
        group_label: "voting-group-1"
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18552"
            interface: "rest"
            addons: []
      - name: "LavaRestPrimaryProvider3"
        group_label: "voting-group-2"
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18553"
            interface: "rest"
            addons: []
      # Backup tier (provider-simulator MAG-18xx surface-backup PR).
      # Distinct ProviderState pids 10-12 → 18566-18568 in the simulator;
      # the smart-router consults this pool only after the primary
      # pool is exhausted on a request. Addons must match
      # the primary tier (empty here) — see IsSupportingAddon note above.
      - name: "LavaRestBackupProvider4"
        is_backup: true
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18566"
            interface: "rest"
            addons: []
      - name: "LavaRestBackupProvider5"
        is_backup: true
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18567"
            interface: "rest"
            addons: []
      - name: "LavaRestBackupProvider6"
        is_backup: true
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18568"
            interface: "rest"
            addons: []
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 1
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 75
  # lava-cv-rest-sim — the REST cross-validation router (MAG-3046). Six primary
  # providers in three groups of two, no backup tier. The REST counterpart of
  # eth-cv-sim, field for field.
  #
  # Why a dedicated router rather than policies on lava-sim-rest: an operator
  # policy (enabled: true) makes cross-validation MANDATORY for that method for
  # every caller, and lava-sim-rest is shared by 30 existing tests. A
  # cross-validated reply carries the lava-cross-validation-* headers INSTEAD of
  # lava-provider-address, and those tests assert lava-provider-address as proof
  # the router is in the request path, so eight of them failed the moment a
  # policy was added there. Group diversity has no request header — min_groups is
  # operator-only — so the rules below cannot be reached caller-side either.
  #
  # Why six providers in three groups: per-group quorum needs
  # max-participants >= min-groups * agreement-threshold, so three groups each
  # needing two matching answers needs six. Three providers in two groups covers
  # plain diversity and nothing else.
  #
  # No backup tier: cross-validation never reaches a backup, so a provider
  # labelled backup would claim a group the router can never count.
  #
  # EVERY POLICY NAMES api_interface. The production chart renders
  # `api-interface: {{ $policy.api_interface | default "jsonrpc" }}`
  # (charts/smart-router/templates/routers_configmap.yaml), so a policy that
  # omits it is filed under jsonrpc — an interface no request on this router ever
  # uses. It would match nothing, the router would start clean, and no test would
  # notice. The local k3d chart instead renders `api-interface: {{ $router.interface }}`,
  # so the same values would behave differently on the two clusters.
  #
  # Each method is a REST path written exactly as the chain spec names it, braces
  # included. The router looks a policy up by (chain-id, api-interface, method)
  # where method is the spec's api name, not the URL the caller sent, so
  # `/cosmos/base/tendermint/v1beta1/blocks/{height}` matches a request for
  # `/blocks/12345`. `/blocks/latest` and `/blocks/{height}` are two separate spec
  # apis and need two separate policies.
  #
  # `/cosmos/tx/v1beta1/simulate` is deliberately absent: the spec marks it
  # stateful, and an enabled policy on a stateful method is refused at startup
  # (ValidateNoStatefulPolicies), which crash-loops the pod.
  - id: "lava-cv-rest-sim"
    network: "lava"
    cross_validation_policies:
      # Strict: ask 3, 2 must match, and those 2 must come from different
      # groups. A caller may tighten the quorum from 2 to 3; max_participants is
      # pinned because floor equals cap; min_groups has no cap.
      - method: "/cosmos/base/tendermint/v1beta1/blocks/latest"
        api_interface: "rest"
        enabled: true
        max_participants:
          floor: 3
          cap: 3
        agreement_threshold:
          floor: 2
          cap: 3
        min_groups:
          floor: 2
      # Loose: one matching answer from one group is enough. Proves a relaxed
      # rule is honoured rather than quietly raised to a default.
      - method: "/cosmos/staking/v1beta1/validators"
        api_interface: "rest"
        enabled: true
        max_participants:
          floor: 1
          cap: 6
        agreement_threshold:
          floor: 1
          cap: 6
        min_groups:
          floor: 1
      # Per-group quorum across two groups: each of two groups must reach two
      # matching answers on its own, then the two group winners must match.
      # Needs 2 * 2 = 4 participants — impossible on a three-provider router.
      - method: "/cosmos/bank/v1beta1/balances/{address}"
        api_interface: "rest"
        enabled: true
        per_group_quorum: true
        max_participants:
          floor: 4
          cap: 6
        agreement_threshold:
          floor: 2
          cap: 3
        min_groups:
          floor: 2
      # Per-group quorum across all three groups: 3 * 2 = 6 participants, the
      # whole pool. The strictest shape this router can be asked for.
      - method: "/cosmos/base/tendermint/v1beta1/blocks/{height}"
        api_interface: "rest"
        enabled: true
        per_group_quorum: true
        max_participants:
          floor: 6
          cap: 6
        agreement_threshold:
          floor: 2
          cap: 2
        min_groups:
          floor: 3
      # Forbidden: a caller's cross-validation headers are ignored outright on
      # this method — the router does not even parse them. Not the same as
      # enabled: false, which only declines to require cross-validation and
      # still honours caller headers. `enabled` and `forbid_caller_cv` on one
      # policy is refused at startup, so this policy carries no other key.
      #
      # node_info is the right method to forbid on: the spec marks it
      # non-deterministic, so two honest providers may legitimately differ, and
      # this is the one method where the router never compares answers at all.
      - method: "/cosmos/base/tendermint/v1beta1/node_info"
        api_interface: "rest"
        forbid_caller_cv: true
    # skip_verifications mirrors lava-sim-rest: the simulator's REST stubs answer
    # the routes but do not satisfy the router's startup chain-fetcher checks.
    #
    # addons stay empty on every provider, as on lava-sim-rest. The archive
    # asymmetry on eth-cv-sim exists to make an addon-narrowed candidate set
    # reachable on JSON-RPC; nothing here asks for an extension, and an
    # asymmetry no test reads is an assumption waiting to be depended on.
    nodes:
      - name: "LavaCvRestPrimaryProvider1"
        group_label: "voting-group-1"
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18602"
            interface: "rest"
            addons: []
      - name: "LavaCvRestPrimaryProvider2"
        group_label: "voting-group-1"
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18603"
            interface: "rest"
            addons: []
      - name: "LavaCvRestPrimaryProvider3"
        group_label: "voting-group-2"
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18604"
            interface: "rest"
            addons: []
      - name: "LavaCvRestPrimaryProvider4"
        group_label: "voting-group-2"
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18605"
            interface: "rest"
            addons: []
      - name: "LavaCvRestPrimaryProvider5"
        group_label: "voting-group-3"
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18606"
            interface: "rest"
            addons: []
      - name: "LavaCvRestPrimaryProvider6"
        group_label: "voting-group-3"
        skip_verifications: "chain-id,pruning,simulate"
        endpoints:
          - url: "http://provider-simulator.smart-router.svc.cluster.local:18607"
            interface: "rest"
            addons: []
    autoscaling:
      enabled: true
      minReplicas: 1
      maxReplicas: 1
      targetCPUUtilizationPercentage: 75
      targetMemoryUtilizationPercentage: 75
  # lava-sim-grpc — simulator router for the Cosmos gRPC chain (MAG-1780
