[tool.black]
line-length = 100
target-version = ['py312']
# Vendored, generated protobuf stubs (MAG-1780) — regenerated, never edited.
extend-exclude = '''
/(
    cosmos_pb2
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["cosmos_pb2"]

[tool.ruff.lint]
# Default ruff rule set (E/F) plus isort (I) so import ordering is checked
# in the same tool instead of adding a second one.
select = ["E", "F", "I"]
# E402 (module import not at top of file) is a real, deliberate pattern in
# this repo's test modules: sys.path.insert(...) must run before the local
# imports it enables, so the imports cannot be at the physical top of the
# file. Enforced per-line via existing `# noqa: E402` comments instead of a
# blanket ignore would be preferable, but several files rely on the same
# sys.path-then-import shape without individual noqa tags; ignoring the rule
# repo-wide avoids churning every test file to add them.
#
# E501 (line too long) is black's job for code; ruff's E501 also flags
# comments/docstrings, and this repo has several deliberately wide comment
# blocks (e.g. constants.py's BTC method-shape table) that would be broken,
# not fixed, by force-wrapping. black still enforces line-length on actual
# code statements.
ignore = ["E402", "E501"]

[tool.ruff.lint.per-file-ignores]
# server.py:2757-2759 hand-aligns a chain of `if ...: continue` filters in
# ControlHandler's /history filtering for readability (columns line up).
# E701 (multiple statements on one line) would otherwise flag the intentional
# style; black's reformat pass already collapses the alignment, so this
# ignore only matters for anyone running ruff before applying black.
"server.py" = ["E701"]

[tool.isort]
profile = "black"
line_length = 100
skip = ["cosmos_pb2"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
disallow_untyped_defs = false
warn_unused_configs = true
exclude = [
    "cosmos_pb2/",  # vendored, generated protobuf stubs
]

# server.py wires per-listener state onto stdlib HTTPServer instances at
# bootstrap (srv.listener / srv.control / srv.registry). The handler classes
# declare those attributes on _SimThreadingHTTPServer, but BaseHTTPRequestHandler
# types ``self.server`` as the plain socketserver.BaseServer, so attribute
# reads through it still flag attr-defined. Suppress exactly that category on
# exactly this module; every other check stays live.
[[tool.mypy.overrides]]
module = ["server"]
disable_error_code = ["attr-defined"]
