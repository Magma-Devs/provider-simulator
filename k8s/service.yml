apiVersion: v1
kind: Service
metadata:
  name: provider-simulator
  namespace: lava-infra
  labels:
    app: provider-simulator
spec:
  selector:
    app: provider-simulator
  type: ClusterIP
  ports:
    - name: provider-1
      port: 18545
      targetPort: 18545
      protocol: TCP
    - name: provider-2
      port: 18546
      targetPort: 18546
      protocol: TCP
    - name: provider-3
      port: 18547
      targetPort: 18547
      protocol: TCP
    # Backup-tier provider ports. Same JSON-RPC handler + ProviderState shape as
    # provider-1/2/3; the only difference is that values_sim.yml wires these
    # into the smart-router's `backup-direct-rpc:` config block via
    # `is_backup: true` on the matching nodes (SimBackup1-3). The router
    # consults this pool only after the primary tier is exhausted on a request.
    # Pinned to 18560-18562 (above WS at 18557-18559) because every port
    # between primary and here is claimed by another surface.
    - name: provider-4
      port: 18560
      targetPort: 18560
      protocol: TCP
    - name: provider-5
      port: 18561
      targetPort: 18561
      protocol: TCP
    - name: provider-6
      port: 18562
      targetPort: 18562
      protocol: TCP
    # Solo JSON-RPC service port (MAG-2061) — mirrors the deployment's
    # provider-solo container port. Wired by the eth-solo-sim-router via
    # the matching containerPort.
    - name: provider-solo
      port: 18581
      targetPort: 18581
      protocol: TCP
    # REST sim service ports (MAG-1777) — mirror the deployment's rest-sim-1/2/3
    # named ports. The HTTPRoute (k8s/httproute-lava-sim-rest.yml) references
    # these names so the gateway can resolve them by name rather than number.
    - name: rest-sim-1
      port: 18551
      targetPort: 18551
      protocol: TCP
    - name: rest-sim-2
      port: 18552
      targetPort: 18552
      protocol: TCP
    - name: rest-sim-3
      port: 18553
      targetPort: 18553
      protocol: TCP
    # Tendermint-RPC sim service ports (MAG-1841) — mirror the deployment's
    # tm-sim-1/2/3 named ports. The HTTPRoute that fronts the lava-sim-tm
    # router references these names so the gateway resolves them by name.
    - name: tm-sim-1
      port: 18554
      targetPort: 18554
      protocol: TCP
    - name: tm-sim-2
      port: 18555
      targetPort: 18555
      protocol: TCP
    - name: tm-sim-3
      port: 18556
      targetPort: 18556
      protocol: TCP
    - name: control
      port: 19000
      targetPort: 19000
      protocol: TCP
    # gRPC provider ports (MAG-1780). HTTP/2 by virtue of gRPC; the named
    # ports here are used by GRPCRoute backendRefs as well as direct
    # in-cluster Service access. REST sim (MAG-1777) reserves 18551-18553.
    - name: grpc-sim-1
      port: 18548
      targetPort: 18548
      protocol: TCP
      appProtocol: kubernetes.io/h2c
    - name: grpc-sim-2
      port: 18549
      targetPort: 18549
      protocol: TCP
      appProtocol: kubernetes.io/h2c
    - name: grpc-sim-3
      port: 18550
      targetPort: 18550
      protocol: TCP
      appProtocol: kubernetes.io/h2c
    # WS sim service ports (MAG-1801). Mirror the deployment's ws-sim-1/2/3
    # named ports. The HTTPRoute (k8s/httproute-lava-sim-ws.yml) references
    # them so the gateway can resolve them by port number.
    - name: ws-sim-1
      port: 18557
      targetPort: 18557
      protocol: TCP
    - name: ws-sim-2
      port: 18558
      targetPort: 18558
      protocol: TCP
    - name: ws-sim-3
      port: 18559
      targetPort: 18559
      protocol: TCP
    # Backup-tier service ports for the non-JSON-RPC surfaces. Same handler
    # + ProviderState shape as the matching primary; values_sim.yml wires the
    # matching nodes (SimGrpcBackup1-3, SimRestBackup1-3, SimTmBackup1-3,
    # SimWsBackup1-3) into the smart-router with `is_backup: true` so each
    # pool is consulted only after its surface's primary tier is exhausted.
    # gRPC backup carries appProtocol h2c so GRPCRoute backendRefs resolve
    # the right protocol; the other surfaces are plain HTTP/1.1.
    - name: grpc-backup-1
      port: 18563
      targetPort: 18563
      protocol: TCP
      appProtocol: kubernetes.io/h2c
    - name: grpc-backup-2
      port: 18564
      targetPort: 18564
      protocol: TCP
      appProtocol: kubernetes.io/h2c
    - name: grpc-backup-3
      port: 18565
      targetPort: 18565
      protocol: TCP
      appProtocol: kubernetes.io/h2c
    - name: rest-backup-1
      port: 18566
      targetPort: 18566
      protocol: TCP
    - name: rest-backup-2
      port: 18567
      targetPort: 18567
      protocol: TCP
    - name: rest-backup-3
      port: 18568
      targetPort: 18568
      protocol: TCP
    - name: tm-backup-1
      port: 18569
      targetPort: 18569
      protocol: TCP
    - name: tm-backup-2
      port: 18570
      targetPort: 18570
      protocol: TCP
    - name: tm-backup-3
      port: 18571
      targetPort: 18571
      protocol: TCP
    - name: ws-backup-1
      port: 18572
      targetPort: 18572
      protocol: TCP
    - name: ws-backup-2
      port: 18573
      targetPort: 18573
      protocol: TCP
    - name: ws-backup-3
      port: 18574
      targetPort: 18574
      protocol: TCP
    # BTC JSON-RPC primary ports (MAG-2089). Dedicated per-chain pool so
    # handler dispatch is port-derived instead of per-provider `chain_family`.
    # Routes every request received on these ports to handlers_btc.handle
    # unconditionally. Eliminates the cross-test contamination that was
    # possible when BTC and ETH shared 18545-18547.
    - name: provider-btc-1
      port: 18575
      targetPort: 18575
      protocol: TCP
    - name: provider-btc-2
      port: 18576
      targetPort: 18576
      protocol: TCP
    - name: provider-btc-3
      port: 18577
      targetPort: 18577
      protocol: TCP
    # LN (Lightning Network) JSON-RPC primary ports (MAG-2089). Dedicated
    # per-chain pool so handler dispatch is port-derived. Routes every request
    # received on these ports to handlers_lnd.handle unconditionally.
    # No LN router is deployed today, but the pool is in place so a future
    # LN router lands without further sim changes.
    - name: provider-ln-1
      port: 18578
      targetPort: 18578
      protocol: TCP
    - name: provider-ln-2
      port: 18579
      targetPort: 18579
      protocol: TCP
    - name: provider-ln-3
      port: 18580
      targetPort: 18580
      protocol: TCP
    # Solana JSON-RPC primary ports (MAG-2231). Dedicated per-chain pool so
    # handler dispatch is port-derived. Routes every request received on these
    # ports to handlers_solana.handle unconditionally. The getLatestBlockhash
    # stub returns result.context.slot and result.value.lastValidBlockHeight
    # separated by a configurable gap (solana_slot_block_gap) to reproduce the
    # router's Solana consistency-filter bug (MAG-1591). 18582-18584 sits above
    # the solo listener (18581), keeping the JSON-RPC chain pools contiguous.
    - name: solana-1
      port: 18582
      targetPort: 18582
      protocol: TCP
    - name: solana-2
      port: 18583
      targetPort: 18583
      protocol: TCP
    - name: solana-3
      port: 18584
      targetPort: 18584
      protocol: TCP
    # Solana solo JSON-RPC service port — mirrors the deployment's
    # solana-solo container port (pid 20 / 18585). A single Solana
    # provider on a dedicated port with its own ProviderState, serving the
    # solana-solo router; peer to provider-solo (18581) on the ETH side. Until
    # now this port was bound in-process but had no Service entry, so a
    # solana-solo router could not reach it via Service DNS.
    - name: solana-solo
      port: 18585
      targetPort: 18585
      protocol: TCP
