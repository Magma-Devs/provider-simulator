apiVersion: v1
kind: Service
metadata:
  name: provider-simulator
  namespace: lava-infra
  labels:
    app: provider-simulator
spec:
  selector:
    app: provider-simulator
  type: ClusterIP
  ports:
    - name: provider-1
      port: 18545
      targetPort: 18545
      protocol: TCP
    - name: provider-2
      port: 18546
      targetPort: 18546
      protocol: TCP
    - name: provider-3
      port: 18547
      targetPort: 18547
      protocol: TCP
    # REST sim service ports (MAG-1777) — mirror the deployment's rest-sim-1/2/3
    # named ports. The HTTPRoute (k8s/httproute-lava-sim-rest.yml) references
    # these names so the gateway can resolve them by name rather than number.
    - name: rest-sim-1
      port: 18551
      targetPort: 18551
      protocol: TCP
    - name: rest-sim-2
      port: 18552
      targetPort: 18552
      protocol: TCP
    - name: rest-sim-3
      port: 18553
      targetPort: 18553
      protocol: TCP
    # Tendermint-RPC sim service ports (MAG-1841) — mirror the deployment's
    # tm-sim-1/2/3 named ports. The HTTPRoute that fronts the lava-sim-tm
    # router references these names so the gateway resolves them by name.
    - name: tm-sim-1
      port: 18554
      targetPort: 18554
      protocol: TCP
    - name: tm-sim-2
      port: 18555
      targetPort: 18555
      protocol: TCP
    - name: tm-sim-3
      port: 18556
      targetPort: 18556
      protocol: TCP
    - name: control
      port: 19000
      targetPort: 19000
      protocol: TCP
    # gRPC provider ports (MAG-1780). HTTP/2 by virtue of gRPC; the named
    # ports here are used by GRPCRoute backendRefs as well as direct
    # in-cluster Service access. REST sim (MAG-1777) reserves 18551-18553.
    - name: grpc-sim-1
      port: 18548
      targetPort: 18548
      protocol: TCP
      appProtocol: kubernetes.io/h2c
    - name: grpc-sim-2
      port: 18549
      targetPort: 18549
      protocol: TCP
      appProtocol: kubernetes.io/h2c
    - name: grpc-sim-3
      port: 18550
      targetPort: 18550
      protocol: TCP
      appProtocol: kubernetes.io/h2c
    # WS sim service ports (MAG-1801). Mirror the deployment's ws-sim-1/2/3
    # named ports. The HTTPRoute (k8s/httproute-lava-sim-ws.yml) references
    # them so the gateway can resolve them by port number.
    - name: ws-sim-1
      port: 18557
      targetPort: 18557
      protocol: TCP
    - name: ws-sim-2
      port: 18558
      targetPort: 18558
      protocol: TCP
    - name: ws-sim-3
      port: 18559
      targetPort: 18559
      protocol: TCP
