      protocol: TCP
    - name: provider-cv-4
      port: 18599
      targetPort: 18599
      protocol: TCP
    - name: provider-cv-5
      port: 18600
      targetPort: 18600
      protocol: TCP
    - name: provider-cv-6
      port: 18601
      targetPort: 18601
      protocol: TCP
