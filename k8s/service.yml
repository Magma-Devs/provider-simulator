apiVersion: v1
kind: Service
metadata:
  name: provider-simulator
  namespace: lava-infra
  labels:
    app: provider-simulator
spec:
  selector:
    app: provider-simulator
  type: ClusterIP
  ports:
    - name: provider-1
      port: 18545
      targetPort: 18545
      protocol: TCP
    - name: provider-2
      port: 18546
      targetPort: 18546
      protocol: TCP
    - name: provider-3
      port: 18547
      targetPort: 18547
      protocol: TCP
    - name: control
      port: 19000
      targetPort: 19000
      protocol: TCP
    # gRPC provider ports (MAG-1780). HTTP/2 by virtue of gRPC; the named
    # ports here are used by GRPCRoute backendRefs as well as direct
    # in-cluster Service access. REST sim (MAG-1777) reserves 18551-18553.
    - name: grpc-sim-1
      port: 18548
      targetPort: 18548
      protocol: TCP
      appProtocol: kubernetes.io/h2c
    - name: grpc-sim-2
      port: 18549
      targetPort: 18549
      protocol: TCP
      appProtocol: kubernetes.io/h2c
    - name: grpc-sim-3
      port: 18550
      targetPort: 18550
      protocol: TCP
      appProtocol: kubernetes.io/h2c
