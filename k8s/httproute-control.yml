apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sim-control-httproute
  namespace: smart-router
spec:
  parentRefs:
    - name: sr-gateway
      namespace: smart-router
  hostnames:
    - "__CONTROL_HOSTNAME__"
  rules:
    # The RESP control listener, on its own port in the same pod. Listed first
    # for readability, which on its own decides nothing: this arrangement relies
    # on the Gateway API rule that the LONGEST matching path prefix wins rather
    # than the first rule written, so /resp/... reaches 19101 and everything else
    # 19000.
    #
    # That rule is the gateway implementation's, not ours, and nothing here
    # proves it. The test beside this file checks only that the rule exists and
    # names the right port. Confirm the routing itself the first time this is
    # deployed, by asking the control hostname for a /resp path and checking it
    # is answered by the RESP api rather than by the provider control API's
    # "unknown path".
    #
    # A path rule rather than a second hostname on purpose: a new hostname would
    # be another name to render, another certificate to hold and another thing
    # the two clusters can disagree about. One hostname, two ports behind it.
    - matches:
        - path:
            type: PathPrefix
            value: /resp
      backendRefs:
        - name: provider-simulator
          namespace: smart-router
          port: 19101
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: provider-simulator
          namespace: smart-router
          port: 19000

