              containerPort: 18643
              protocol: TCP
            - name: spare-18644
              containerPort: 18644
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # Readiness uses /ready (not /health): /ready confirms every listener
          # port is actually bound and accepting connections, so kube-proxy
          # won't send Service traffic to a pod that is still binding ports. A
          # router relaying to a half-bound sim gets connection-refused, which
          # its classifier turns into a 503, and the providers land on the
          # blocked list — poisoning the pairing pool from the start.
          # timeoutSeconds covers the worst case where many ports are still
          # unbound (each unbound port costs ~0.1s in the /ready check).
          readinessProbe:
            httpGet:
              path: /ready
              port: control
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: control
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
      volumes:
        - name: tmp
          emptyDir: {}
      restartPolicy: Always

