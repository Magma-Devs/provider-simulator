apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-simulator
  namespace: lava-infra
  labels:
    app: provider-simulator
    app.kubernetes.io/name: provider-simulator
    app.kubernetes.io/component: testing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provider-simulator
  template:
    metadata:
      labels:
        app: provider-simulator
        app.kubernetes.io/name: provider-simulator
        app.kubernetes.io/component: testing
    spec:
      containers:
        - name: provider-simulator
          image: provider-simulator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: provider-1
              containerPort: 18545
              protocol: TCP
            - name: provider-2
              containerPort: 18546
              protocol: TCP
            - name: provider-3
              containerPort: 18547
              protocol: TCP
            # Backup-tier provider listeners. Same JSONRPCHandler binding as
            # provider-1/2/3; values_sim.yml flags the matching nodes
            # (SimBackup1-3) with is_backup: true so the router routes to
            # this pool only after exhausting the primary tier on a request.
            # Pinned to 18560-18562 (above WS at 18557-18559) because every
            # port between primary and here is claimed by another surface.
            - name: provider-4
              containerPort: 18560
              protocol: TCP
            - name: provider-5
              containerPort: 18561
              protocol: TCP
            - name: provider-6
              containerPort: 18562
              protocol: TCP
            # Solo JSON-RPC listener (MAG-2061) — pid 19 / port 18581. Single
            # provider, no backup pair; serves the eth-solo-sim-router which
            # is wired as the customer-outage deployment shape. The server
            # bootstrap loop owns the entry via ALL_PROVIDER_PORTS.
            - name: provider-solo
              containerPort: 18581
              protocol: TCP
            # REST sim listeners (MAG-1777) — peer to provider-1/2/3, one per
            # simulated provider, sharing ProviderState so a /scenario update
            # is visible from both the JSON-RPC and REST ports.
            - name: rest-sim-1
              containerPort: 18551
              protocol: TCP
            - name: rest-sim-2
              containerPort: 18552
              protocol: TCP
            - name: rest-sim-3
              containerPort: 18553
              protocol: TCP
            # Tendermint-RPC sim listeners (MAG-1841) — peer to provider-1/2/3,
            # one per simulated provider, sharing ProviderState so a /scenario
            # update is visible from JSON-RPC, REST, gRPC, and Tendermint ports.
            - name: tm-sim-1
              containerPort: 18554
              protocol: TCP
            - name: tm-sim-2
              containerPort: 18555
              protocol: TCP
            - name: tm-sim-3
              containerPort: 18556
              protocol: TCP
            - name: control
              containerPort: 19000
              protocol: TCP
            # gRPC provider ports (MAG-1780)
            - name: grpc-sim-1
              containerPort: 18548
              protocol: TCP
            - name: grpc-sim-2
              containerPort: 18549
              protocol: TCP
            - name: grpc-sim-3
              containerPort: 18550
              protocol: TCP
            # WS provider listeners (MAG-1801) — peer to provider-1/2/3,
            # one per simulated provider, sharing ProviderState so a
            # /scenario update is visible from every transport.
            - name: ws-sim-1
              containerPort: 18557
              protocol: TCP
            - name: ws-sim-2
              containerPort: 18558
              protocol: TCP
            - name: ws-sim-3
              containerPort: 18559
              protocol: TCP
            # Backup-tier listeners for the non-JSON-RPC surfaces. Same handler
            # binding as the matching primary; values_sim.yml flags the matching
            # nodes (SimGrpcBackup1-3, SimRestBackup1-3, SimTmBackup1-3,
            # SimWsBackup1-3) with `is_backup: true` so the smart-router routes
            # to each pool only after exhausting its surface's primary on a
            # request. Each pool has its own ProviderState — distinct pids
            # (7-18) keep the control-API addressing unambiguous.
            #
            # Port allocation is a single contiguous block 18563-18574 stacked
            # above the JSON-RPC backup at 18560-18562.
            - name: grpc-backup-1
              containerPort: 18563
              protocol: TCP
            - name: grpc-backup-2
              containerPort: 18564
              protocol: TCP
            - name: grpc-backup-3
              containerPort: 18565
              protocol: TCP
            - name: rest-backup-1
              containerPort: 18566
              protocol: TCP
            - name: rest-backup-2
              containerPort: 18567
              protocol: TCP
            - name: rest-backup-3
              containerPort: 18568
              protocol: TCP
            - name: tm-backup-1
              containerPort: 18569
              protocol: TCP
            - name: tm-backup-2
              containerPort: 18570
              protocol: TCP
            - name: tm-backup-3
              containerPort: 18571
              protocol: TCP
            - name: ws-backup-1
              containerPort: 18572
              protocol: TCP
            - name: ws-backup-2
              containerPort: 18573
              protocol: TCP
            - name: ws-backup-3
              containerPort: 18574
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: control
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: control
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
      restartPolicy: Always

