apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-simulator
  namespace: lava-infra
  labels:
    app: provider-simulator
    app.kubernetes.io/name: provider-simulator
    app.kubernetes.io/component: testing
spec:
  replicas: 1
  # Recreate (not the apps/v1 default RollingUpdate) — MAG-2318. All state
  # (history, QoS-relevant scenario config, counters) lives in-memory in a
  # single pod (see README's "intentionally 1 replica" note); a rolling
  # update would briefly run old-and-new pods side by side under the same
  # Service, splitting /scenario writes and /history reads across two
  # independent state maps. Recreate guarantees the old pod is fully torn
  # down before the new one starts, matching the single-replica, in-memory
  # state model this deployment already relies on.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: provider-simulator
  template:
    metadata:
      labels:
        app: provider-simulator
        app.kubernetes.io/name: provider-simulator
        app.kubernetes.io/component: testing
    spec:
      # Non-root (MAG-2318) — matches the Dockerfile's USER simulator (uid
      # 999). Pod-level securityContext is defense in depth: it holds even
      # if a future image change drops the Dockerfile USER line.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: provider-simulator
          image: provider-simulator:latest
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            # Verified by running the built image with `docker run --read-only
            # --tmpfs /tmp`: server boots, /health returns ok, and a real
            # eth_blockNumber request round-trips with no permission errors in
            # the logs. The simulator keeps all state in memory (no filesystem
            # writes at runtime) — the only thing that wants a writable path at
            # all is Python's own /tmp usage, covered by the emptyDir below.
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          ports:
            - name: provider-1
              containerPort: 18545
              protocol: TCP
            - name: provider-2
              containerPort: 18546
              protocol: TCP
            - name: provider-3
              containerPort: 18547
              protocol: TCP
            # Backup-tier provider listeners. Same JSONRPCHandler binding as
            # provider-1/2/3; values_sim.yml flags the matching nodes
            # (SimBackup1-3) with is_backup: true so the router routes to
            # this pool only after exhausting the primary tier on a request.
            # Pinned to 18560-18562 (above WS at 18557-18559) because every
            # port between primary and here is claimed by another surface.
            - name: provider-4
              containerPort: 18560
              protocol: TCP
            - name: provider-5
              containerPort: 18561
              protocol: TCP
            - name: provider-6
              containerPort: 18562
              protocol: TCP
            # Solo JSON-RPC listener (MAG-2061) — pid 19 / port 18581. Single
            # provider, no backup pair; serves the eth-solo-sim-router which
            # is wired as the customer-outage deployment shape. The server
            # bootstrap loop owns the entry via ALL_PROVIDER_PORTS.
            - name: provider-solo
              containerPort: 18581
              protocol: TCP
            # Solana solo JSON-RPC listener — pid 20 / port 18585. A single
            # Solana provider serving the solana-solo router; peer to
            # provider-solo (18581) on the ETH side. Declared here and in the
            # Service so the solo router can reach it via Service DNS (until now
            # the port was bound in-process but had no Service entry).
            # Name is deliberately short: Kubernetes caps container port names
            # at 15 characters, so the provider- prefix does not fit here.
            - name: solana-solo
              containerPort: 18585
              protocol: TCP
            # REST sim listeners (MAG-1777) — peer to provider-1/2/3, one per
            # simulated provider, sharing ProviderState so a /scenario update
            # is visible from both the JSON-RPC and REST ports.
            - name: rest-sim-1
              containerPort: 18551
              protocol: TCP
            - name: rest-sim-2
              containerPort: 18552
              protocol: TCP
            - name: rest-sim-3
              containerPort: 18553
              protocol: TCP
            # Tendermint-RPC sim listeners (MAG-1841) — peer to provider-1/2/3,
            # one per simulated provider, sharing ProviderState so a /scenario
            # update is visible from JSON-RPC, REST, gRPC, and Tendermint ports.
            - name: tm-sim-1
              containerPort: 18554
              protocol: TCP
            - name: tm-sim-2
              containerPort: 18555
              protocol: TCP
            - name: tm-sim-3
              containerPort: 18556
              protocol: TCP
            - name: control
              containerPort: 19000
              protocol: TCP
            # gRPC provider ports (MAG-1780)
            - name: grpc-sim-1
              containerPort: 18548
              protocol: TCP
            - name: grpc-sim-2
              containerPort: 18549
              protocol: TCP
            - name: grpc-sim-3
              containerPort: 18550
              protocol: TCP
            # WS provider listeners (MAG-1801) — peer to provider-1/2/3,
            # one per simulated provider, sharing ProviderState so a
            # /scenario update is visible from every transport.
            - name: ws-sim-1
              containerPort: 18557
              protocol: TCP
            - name: ws-sim-2
              containerPort: 18558
              protocol: TCP
            - name: ws-sim-3
              containerPort: 18559
              protocol: TCP
            # Backup-tier listeners for the non-JSON-RPC surfaces. Same handler
            # binding as the matching primary; values_sim.yml flags the matching
            # nodes (SimGrpcBackup1-3, SimRestBackup1-3, SimTmBackup1-3,
            # SimWsBackup1-3) with `is_backup: true` so the smart-router routes
            # to each pool only after exhausting its surface's primary on a
            # request. Each pool has its own ProviderState — distinct pids
            # (7-18) keep the control-API addressing unambiguous.
            #
            # Port allocation is a single contiguous block 18563-18574 stacked
            # above the JSON-RPC backup at 18560-18562.
            - name: grpc-backup-1
              containerPort: 18563
              protocol: TCP
            - name: grpc-backup-2
              containerPort: 18564
              protocol: TCP
            - name: grpc-backup-3
              containerPort: 18565
              protocol: TCP
            - name: rest-backup-1
              containerPort: 18566
              protocol: TCP
            - name: rest-backup-2
              containerPort: 18567
              protocol: TCP
            - name: rest-backup-3
              containerPort: 18568
              protocol: TCP
            - name: tm-backup-1
              containerPort: 18569
              protocol: TCP
            - name: tm-backup-2
              containerPort: 18570
              protocol: TCP
            - name: tm-backup-3
              containerPort: 18571
              protocol: TCP
            - name: ws-backup-1
              containerPort: 18572
              protocol: TCP
            - name: ws-backup-2
              containerPort: 18573
              protocol: TCP
            - name: ws-backup-3
              containerPort: 18574
              protocol: TCP
            # BTC JSON-RPC primary ports (MAG-2089). Dedicated per-chain pool,
            # already listened on by the running image — this manifest just
            # never declared them. See k8s/service.yml for the matching
            # Service entries, already present there.
            - name: provider-btc-1
              containerPort: 18575
              protocol: TCP
            - name: provider-btc-2
              containerPort: 18576
              protocol: TCP
            - name: provider-btc-3
              containerPort: 18577
              protocol: TCP
            # LN (Lightning Network) JSON-RPC primary ports (MAG-2089). Same
            # gap as BTC above.
            - name: provider-ln-1
              containerPort: 18578
              protocol: TCP
            - name: provider-ln-2
              containerPort: 18579
              protocol: TCP
            - name: provider-ln-3
              containerPort: 18580
              protocol: TCP
            # Solana JSON-RPC primary ports (MAG-2231). Same gap as BTC above.
            # Name is deliberately short, matching solana-solo below —
            # Kubernetes caps container port names at 15 characters, so the
            # provider- prefix used in k8s/service.yml does not fit here.
            - name: solana-1
              containerPort: 18582
              protocol: TCP
            - name: solana-2
              containerPort: 18583
              protocol: TCP
            - name: solana-3
              containerPort: 18584
              protocol: TCP
            # eth-duo-sim dedicated JSON-RPC ports (2026-07-27) — a 2-provider
            # pool with its own stake weights, no longer sharing eth-sim's
            # 18545/18546. Declared here and in the Service so the
            # eth-duo-sim-router can reach it via Service DNS.
            - name: provider-duo-1
              containerPort: 18586
              protocol: TCP
            - name: provider-duo-2
              containerPort: 18587
              protocol: TCP
            - name: provider-best-1
              containerPort: 18588
              protocol: TCP
            - name: provider-best-2
              containerPort: 18589
              protocol: TCP
            - name: provider-best-3
              containerPort: 18590
              protocol: TCP
            - name: provider-prio-1
              containerPort: 18591
              protocol: TCP
            - name: provider-prio-2
              containerPort: 18592
              protocol: TCP
            - name: provider-prio-3
              containerPort: 18593
              protocol: TCP
            - name: provider-prec-1
              containerPort: 18594
              protocol: TCP
            - name: provider-prec-2
              containerPort: 18595
              protocol: TCP
            - name: provider-cv-1
              containerPort: 18596
              protocol: TCP
            - name: provider-cv-2
              containerPort: 18597
              protocol: TCP
            - name: provider-cv-3
              containerPort: 18598
              protocol: TCP
            - name: provider-cv-4
              containerPort: 18599
              protocol: TCP
            - name: provider-cv-5
              containerPort: 18600
              protocol: TCP
            - name: provider-cv-6
              containerPort: 18601
              protocol: TCP
            - name: spare-18602
              containerPort: 18602
              protocol: TCP
            - name: spare-18603
              containerPort: 18603
              protocol: TCP
            - name: spare-18604
              containerPort: 18604
              protocol: TCP
            - name: spare-18605
              containerPort: 18605
              protocol: TCP
            - name: spare-18606
              containerPort: 18606
              protocol: TCP
            - name: spare-18607
              containerPort: 18607
              protocol: TCP
            - name: spare-18608
              containerPort: 18608
              protocol: TCP
            - name: spare-18609
              containerPort: 18609
              protocol: TCP
            - name: spare-18610
              containerPort: 18610
              protocol: TCP
            - name: spare-18611
              containerPort: 18611
              protocol: TCP
            - name: spare-18612
              containerPort: 18612
              protocol: TCP
            - name: spare-18613
              containerPort: 18613
              protocol: TCP
            - name: spare-18614
              containerPort: 18614
