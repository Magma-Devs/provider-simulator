apiVersion: apps/v1
kind: Deployment
metadata:
  name: provider-simulator
  namespace: lava-infra
  labels:
    app: provider-simulator
    app.kubernetes.io/name: provider-simulator
    app.kubernetes.io/component: testing
spec:
  replicas: 1
  selector:
    matchLabels:
      app: provider-simulator
  template:
    metadata:
      labels:
        app: provider-simulator
        app.kubernetes.io/name: provider-simulator
        app.kubernetes.io/component: testing
    spec:
      containers:
        - name: provider-simulator
          image: provider-simulator:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: provider-1
              containerPort: 18545
              protocol: TCP
            - name: provider-2
              containerPort: 18546
              protocol: TCP
            - name: provider-3
              containerPort: 18547
              protocol: TCP
            # REST sim listeners (MAG-1777) — peer to provider-1/2/3, one per
            # simulated provider, sharing ProviderState so a /scenario update
            # is visible from both the JSON-RPC and REST ports.
            - name: rest-sim-1
              containerPort: 18551
              protocol: TCP
            - name: rest-sim-2
              containerPort: 18552
              protocol: TCP
            - name: rest-sim-3
              containerPort: 18553
              protocol: TCP
            - name: control
              containerPort: 19000
              protocol: TCP
            # gRPC provider ports (MAG-1780)
            - name: grpc-sim-1
              containerPort: 18548
              protocol: TCP
            - name: grpc-sim-2
              containerPort: 18549
              protocol: TCP
            - name: grpc-sim-3
              containerPort: 18550
              protocol: TCP
            # WS provider listeners (MAG-1801) — peer to provider-1/2/3,
            # one per simulated provider, sharing ProviderState so a
            # /scenario update is visible from every transport.
            - name: ws-sim-1
              containerPort: 18557
              protocol: TCP
            - name: ws-sim-2
              containerPort: 18558
              protocol: TCP
            - name: ws-sim-3
              containerPort: 18559
              protocol: TCP
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: control
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: control
            initialDelaySeconds: 5
            periodSeconds: 15
            timeoutSeconds: 3
      restartPolicy: Always

