# HTTPRoute for the WebSocket simulator providers (MAG-1801).
#
# Why HTTPRoute and not GRPCRoute
# --------------------------------
# WebSocket uses HTTP/1.1 Upgrade to switch protocols. The Gateway API
# HTTPRoute kind carries the Upgrade header transparently when the underlying
# gateway controller supports it (Cilium Gateway in this cluster, confirmed
# by a live wss:// handshake through the deployed gateway: client receives
# HTTP/1.1 101 Switching Protocols with the correct Sec-WebSocket-Accept,
# and a subsequent eth_subscribe/eth_unsubscribe round-trip completes).
# gRPC's HTTP/2-only model would force us to use GRPCRoute, which doesn't
# model the Upgrade dance.
#
# HTTP/2 caveat: Cloudflare fronts this route and will speak HTTP/2 to
# clients by default. The simulator's WsHandler only accepts the upgrade
# over HTTP/1.1 (see handlers_ws.py — Sec-WebSocket-Version=13 + Upgrade
# headers are HTTP/1.1-shaped), so HTTP/2-default clients (recent curl,
# some Go libs) get 400 "bad WS upgrade request" unless they force
# --http1.1. Browsers and the Python `websockets` library default to
# HTTP/1.1 and work as-is.
#
# Hostname is placeholder-substituted at deploy time by scripts/deploy.sh
# from $LAVA_SIM_WS_HOSTNAME (typically lava-sim-ws.<BASE_DOMAIN>).
#
# Backend strategy
# ----------------
# One rule with three backendRefs at equal weight, matching the existing REST
# pattern. The gateway picks one backend on the WS upgrade request; after the
# 101 Switching Protocols response, the connection is sticky to that backend
# (TCP affinity). Tests that want to address a specific WS provider directly
# hit the in-cluster service port (ws-sim-1 / ws-sim-2 / ws-sim-3) instead.
#
# The /ws path constraint is enforced by the simulator's WsHandler, not at
# the gateway, so PathPrefix=/ matches the REST route shape exactly.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lava-sim-ws-httproute
  namespace: lava-infra
spec:
  parentRefs:
    - name: sr-gateway
      namespace: lava-infra
  hostnames:
    - "__LAVA_SIM_WS_HOSTNAME__"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: provider-simulator
          namespace: lava-infra
          port: 18557
          weight: 1
        - name: provider-simulator
          namespace: lava-infra
          port: 18558
          weight: 1
        - name: provider-simulator
          namespace: lava-infra
          port: 18559
          weight: 1
